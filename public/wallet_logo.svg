<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="walletBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#009e66" />
      <stop offset="100%" stop-color="#007a4d" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00472e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Green Squircle App Icon Background -->
  <rect x="12" y="12" width="176" height="176" rx="46" fill="url(#walletBgGrad)" filter="url(#subtleShadow)" />

  <!-- White Wallet Line Icon (Matches image.png) -->
  <g transform="translate(100, 100)" stroke="#ffffff" fill="none" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Flap Fold -->
    <path d="M -38 -26 L 24 -26 C 30 -26, 35 -21, 35 -15" />
    <!-- Main Wallet Body -->
    <path d="M -40 -16 L 36 -16 C 42 -16, 46 -12, 46 -6 L 46 36 C 46 42, 42 46, 36 46 L -40 46 C -46 46, -50 42, -50 36 L -50 -6 C -50 -12, -46 -16, -40 -16 Z" />
    <!-- Clasp / Fastener on Right Side -->
    <path d="M 28 8 L 40 8 C 45 8, 48 11, 48 16 C 48 21, 45 24, 40 24 L 28 24" fill="#008a57" />
    <!-- Clasp Button Dot -->
    <circle cx="36" cy="16" r="2.5" fill="#ffffff" stroke="none" />
  </g>
</svg>
